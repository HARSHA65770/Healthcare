# Server Configuration
server.port=8000

# Default SQL Database Configuration (H2 File-backed in ./data/rural_health_sql)
spring.datasource.url=jdbc:h2:file:./data/rural_health_sql;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Web Console (Interactive SQL Query GUI)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Logging
logging.level.com.healthcare=INFO
logging.level.org.springframework.web=INFO
