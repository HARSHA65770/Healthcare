# Server Configuration
server.port=8000

# SQL Database Configuration (H2 File-backed SQL Database by default)
# Accessible via browser at: http://localhost:8000/h2-console
spring.datasource.url=jdbc:h2:file:./rural_health_sql;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (Interactive SQL Query GUI)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ========================================================
# OPTIONAL: To switch to PostgreSQL in production:
# spring.datasource.url=jdbc:postgresql://localhost:5432/rural_health
# spring.datasource.username=postgres
# spring.datasource.password=your_password
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#
# OPTIONAL: To switch to MySQL:
# spring.datasource.url=jdbc:mysql://localhost:3306/rural_health?useSSL=false
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# ========================================================

# Logging
logging.level.com.healthcare=INFO
logging.level.org.springframework.web=INFO
